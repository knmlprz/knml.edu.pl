# Uruchomienie API publikacji (w tym folderze): podman compose up --build
# (docker compose up --build też działa). Ustawienia i sekrety: plik .env obok (wzór: .env.example).
services:
  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file: .env
    ports:
      - "8787:8787"
    restart: unless-stopped
