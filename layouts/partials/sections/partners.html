{{ if .Site.Params.partners.enable | default false }}
<section id="partners" class="py-5">
    <div class="container">
        <h3 class="text-center">{{ .Site.Params.partners.title | default "Partnerzy" }}</h3>
        <div class="row justify-content-center align-items-center px-3 px-md-5 px-lg-5">
            {{ range .Site.Params.partners.items }}
            <div class="col-lg-4 col-md-6 my-3 text-center">
                {{ if .url }}
                <a href="{{ .url }}" title="{{ .name }}" target="_blank" rel="noopener noreferrer">
                    <img src="{{ .logo | relURL }}" alt="{{ .name }}" class="img-fluid" style="max-height: 120px; mix-blend-mode: multiply;">
                </a>
                {{ else }}
                <img src="{{ .logo | relURL }}" alt="{{ .name }}" class="img-fluid" style="max-height: 120px; mix-blend-mode: multiply;">
                {{ end }}
            </div>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
