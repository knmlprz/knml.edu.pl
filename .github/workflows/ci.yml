# Sprawdzenie nowej strony przy każdym Pull Requeście i pushu na przebudowastrony.
# Niczego nie publikuje: zielony lub czerwony znaczek przy PR mówi, czy strona się buduje.
name: CI

on:
  pull_request:
  push:
    branches: [przebudowastrony]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-website
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
      - name: Zainstaluj Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: new-website/package-lock.json
      - name: Zainstaluj zależności
        run: npm ci
      - name: Sprawdź typy i treść
        run: npm run check
      - name: Testy src/lib (Vitest)
        run: npm test
      - name: Zbuduj stronę
        run: npm run build
      - name: Zbuduj stronę z wpisami testowymi
        run: npm run build:test
      - name: Zainstaluj przeglądarkę do testów
        run: npx playwright install --with-deps chromium
      - name: Testy w przeglądarce (Playwright)
        run: npx playwright test
      - name: Zainstaluj zależności API publikacji
        working-directory: services/api
        run: npm ci
      - name: Test publikacji z kreatora (API z udawanym GitHubem, Playwright)
        working-directory: services/api
        run: node build.mjs test/e2e-server.ts && npx playwright test

  # API publikacji wpisów (services/api) w tym samym obrazie co na serwerze, bo tylko tam jest
  # heif-dec do zdjęć HEIC. W kontenerze testy HEIC nie mogą się pominąć.
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v7
      - name: Zbuduj obraz testowy API
        run: docker build --target test -t knml-api-test -f services/api/Dockerfile .
      - name: Sprawdź typy i uruchom testy API (Vitest, z HEIC)
        run: docker run --rm knml-api-test
      - name: Zbuduj obraz produkcyjny API
        run: docker build -t knml-api -f services/api/Dockerfile .
